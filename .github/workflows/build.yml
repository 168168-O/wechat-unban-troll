name: build-tipa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build WeChatUnban.tipa
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          APP="out/Payload/WeChatUnban.app"
          rm -rf out && mkdir -p "$APP"
          xcrun --sdk iphoneos swiftc -parse-as-library -target arm64-apple-ios14.0 -sdk "$SDK" -O \
            -module-name WeChatUnban -framework SwiftUI -framework UIKit -framework WebKit -framework Foundation \
            apps/unban/Sources/*.swift -o "$APP/WeChatUnban"
          cp apps/unban/Resources/Info.plist "$APP/Info.plist"
          printf 'APPL????' > "$APP/PkgInfo"
          codesign --force --sign - --entitlements apps/unban/WeChatUnban.entitlements "$APP"
          cd out && zip -qry WeChatUnban.tipa Payload && cd ..

      - name: Build ENAppeal.tipa
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          APP="out2/Payload/ENAppeal.app"
          rm -rf out2 && mkdir -p "$APP"
          xcrun --sdk iphoneos swiftc -parse-as-library -target arm64-apple-ios14.0 -sdk "$SDK" -O \
            -module-name ENAppeal -framework SwiftUI -framework UIKit -framework WebKit -framework Foundation \
            apps/apply/Sources/*.swift -o "$APP/ENAppeal"
          cp apps/appeal/Resources/Info.plist "$APP/Info.plist"
          printf 'APPL????' > "$APP/PkgInfo"
          codesign --force --sign - --entitlements apps/appeal/ENAppeal.entitlements "$APP"
          cd out2 && zip -qry ENAppeal.tipa Payload && cd ..

      - name: Install ldid and Theos
        run: |
          set -eux
          brew install ldid || true
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          curl -sL https://github.com/theos/sdks/archive/master.tar.gz -o /tmp/sdks.tgz
          tar xzf /tmp/sdks.tgz -C /tmp
          cp -r /tmp/sdks-master/*.sdk "$HOME/theos/sdks/" || true
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build CamSrc.dylib (rootless)
        run: |
          set -eux
          rm -rf /tmp/fishhook
          git clone --depth 1 https://github.com/facebook/fishhook /tmp/fishhook
          mkdir -p vcam/ios/vendor
          cp /tmp/fishhook/fishhook.h /tmp/fishhook/fishhook.c vcam/ios/vendor/
          cd vcam/ios
          make clean || true
          make THEOS_PACKAGE_SCHEME=rootless || true
          mkdir -p "$GITHUB_WORKSPACE/out3"
          find . -name 'CamSrc.dylib' -exec cp {} "$GITHUB_WORKSPACE/out3/CamSrc.dylib" \;
          ls -lh "$GITHUB_WORKSPACE/out3" || true
          file "$GITHUB_WORKSPACE/out3/CamSrc.dylib" || true

      - uses: actions/upload-artifact@v4
        with:
          name: products
          path: |
            out/WeChatUnban.tipa
            out2/ENAppeal.tipa
            out3/CamSrc.dylib
          if-no-files-found: warn

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 解封 + 虚拟摄像头 v1.0.${{ github.run_number }}
          body: |
            - ENAppeal.tipa     三屏解封申请（全中文 + 语音）
            - WeChatUnban.tipa  设备环境工具
            - CamSrc.dylib      虚拟摄像头 tweak（注入微信）
          files: |
            out/WeChatUnban.tipa
            out2/ENAppeal.tipa
            out3/CamSrc.dylib
          fail_on_unmatched_files: false
